name: 新刊データを毎日自動更新

on:
  schedule:
    # UTC 11:30 = JST 20:30（無料枠は数時間ズレることがあるため、遅延を見込んで前倒し）
    - cron: "30 11 * * *"
  workflow_dispatch: {} # 手動実行ボタンも使えるようにしておく

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 楽天ブックスAPIから新刊データを取得
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: node scripts/fetch-rakuten.mjs

      - name: Amazon Creators APIで商品リンクを取得
        env:
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        run: node scripts/fetch-amazon.mjs

      - name: sitemap.xmlの更新日時を書き換え
        run: |
          TODAY=$(TZ='Asia/Tokyo' date +%Y-%m-%d)
          cat > sitemap.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://shinkandana.jp/</loc>
              <lastmod>${TODAY}</lastmod>
              <changefreq>daily</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          EOF

      - name: data.jsonをコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json sitemap.xml
          git diff --cached --quiet || git commit -m "新刊データを自動更新"
          git push
